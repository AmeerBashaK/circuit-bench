<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Circuit Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: header bar, part toolbar, then a two-column bench (canvas + inspector) with an event log below. Copper accent from PCB traces. */
:root{
  --bg:#f2f3f5; --panel:#ffffff; --ink:#1c2229; --muted:#5b6470; --line:#dadde2;
  --canvas:#fbfbfc; --grid:#cfd4db; --wire:#39424d; --accent:#b8622a; --accent-ink:#ffffff;
  --dot:#e39a2d; --danger:#c0352d; --ok:#2e8655; --smoke:#7d8088; --soft:#eef0f3;
  --volt:#2f7fc4; --amp:#c9740f;
  --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121518; --panel:#1a1e23; --ink:#e5e8ec; --muted:#98a1ab; --line:#2b3138;
  --canvas:#0f1215; --grid:#2c333b; --wire:#b7bfc8; --accent:#e0874a; --accent-ink:#1a1208;
  --dot:#f2b54f; --danger:#ef6a5e; --ok:#5ccb8b; --smoke:#9aa0a8; --soft:#22272d; --volt:#6eaef0; --amp:#f2b54f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121518; --panel:#1a1e23; --ink:#e5e8ec; --muted:#98a1ab; --line:#2b3138;
  --canvas:#0f1215; --grid:#2c333b; --wire:#b7bfc8; --accent:#e0874a; --accent-ink:#1a1208;
  --dot:#f2b54f; --danger:#ef6a5e; --ok:#5ccb8b; --smoke:#9aa0a8; --soft:#22272d; --volt:#6eaef0; --amp:#f2b54f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-ui);padding-block:16px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.run{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
button,select,input{font:inherit;color:var(--ink)}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
select,input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.time{font-family:var(--font-mono);font-size:13px;color:var(--muted);min-width:72px;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.tools .sep{width:1px;background:var(--line);margin:2px 4px}
.tools button{border-color:transparent;padding:6px 10px;font-size:13px}
.tools button:hover{background:var(--soft)}
.tools button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.work{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;align-items:start}
@media (max-width:880px){.work{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--canvas)}
#cv{display:block;width:100%;aspect-ratio:900/540;touch-action:none;cursor:crosshair}
.hint{position:absolute;left:10px;top:8px;right:10px;font-size:12px;color:var(--muted);pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:600;margin:0}
.panel .kind{font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.field.chk{flex-direction:row;align-items:center;gap:8px}
.field.chk label{font-size:13px;color:var(--ink)}
.err{font-size:12px;color:var(--danger)}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ro{background:var(--soft);border-radius:8px;padding:8px 10px}
.ro span{display:block;font-size:11px;color:var(--muted);letter-spacing:.02em}
.ro b{font-family:var(--font-mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.health{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.health i{display:block;height:100%;background:var(--ok);transition:width .15s}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.actions button{font-size:13px;padding:5px 10px}
.danger{color:var(--danger)}
.help{color:var(--muted);font-size:13px;margin:0}
.help ul{margin:6px 0 0;padding-left:18px}
kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--soft)}
.graphs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.ghead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px;margin-bottom:6px}
.ghead h2{font-size:13px;font-weight:600;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.gcard canvas{display:block;width:100%;height:190px}
.log{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.log h2{font-size:13px;font-weight:600;margin:0 0 6px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:160px;overflow:auto}
.log li{font-size:13px;display:flex;gap:10px}
.log li time{font-family:var(--font-mono);color:var(--muted);font-size:12px;min-width:56px;font-variant-numeric:tabular-nums}
.log li.bad{color:var(--danger)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Circuit Bench</h1><p>Draw a circuit, power it, and see what survives.</p></div>
    <div class="run">
      <button id="play" class="primary">Pause</button>
      <select id="speed" aria-label="Simulation speed">
        <option value="1">Real time</option><option value="0.25">0.25× slow</option><option value="0.05">0.05× slow</option>
      </select>
      <span class="time" id="time">t = 0.00 s</span>
      <button id="repair">Reset parts</button>
      <select id="examples" aria-label="Load an example"><option value="">Load example…</option></select>
      <button id="clear">Clear</button>
    </div>
  </header>

  <div class="tools" role="toolbar" aria-label="Parts" id="tools"></div>

  <main class="work">
    <div class="stage"><canvas id="cv" aria-label="Circuit drawing area"></canvas><div class="hint" id="hint"></div></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <section class="graphs">
    <div class="gcard">
      <div class="ghead"><h2 id="gv-title">Voltage and current</h2>
        <div class="legend"><span><i style="background:var(--volt)"></i>Voltage (left axis)</span><span><i style="background:var(--amp)"></i>Current (right axis)</span></div></div>
      <canvas id="gv" aria-label="Voltage and current of the selected part over time"></canvas>
    </div>
    <div class="gcard">
      <div class="ghead"><h2>Component health</h2><div class="legend" id="gh-legend"></div></div>
      <canvas id="gh" aria-label="Health of every part over time"></canvas>
    </div>
  </section>

  <section class="log"><h2>Events</h2><ol id="log"></ol></section>
</div>

<script>
(()=>{
const G=20, LW=900, LH=540, VT=0.02585, SAVE='circuit-bench-v1';
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LEDC={red:{vf:1.8,c:'#ff4433'},yellow:{vf:2.0,c:'#ffcc22'},green:{vf:2.2,c:'#3ad16b'},blue:{vf:3.0,c:'#4a8dff'},white:{vf:3.1,c:'#f4f6ff'}};
const TYPES={
  wire:{label:'Wire',min:1,def:()=>({})},
  resistor:{label:'Resistor',pre:'R',min:2,def:()=>({R:470,P:0.25})},
  capacitor:{label:'Capacitor',pre:'C',min:2,def:()=>({C:100,Vmax:16,polar:true})},
  diode:{label:'Diode',pre:'D',min:2,def:()=>({Imax:1})},
  led:{label:'LED',pre:'LED',min:2,def:()=>({color:'red',Imax:0.03})},
  bjt:{label:'Transistor',pre:'Q',def:()=>({pnp:false,beta:100,Pmax:0.625})},
  dc:{label:'DC source',pre:'V',min:2,def:()=>({V:9,r:0.2})},
  ac:{label:'AC source',pre:'V',min:2,def:()=>({V:10,f:2,r:0.2})},
  switch:{label:'Switch',pre:'S',min:2,def:()=>({closed:true})},
};
const TWO=['wire','resistor','capacitor','diode','led','dc','ac','switch'];
const FIELDS={
  resistor:[['R','Resistance (Ω)','num'],['P','Power rating','sel',[[0.125,'0.125 W'],[0.25,'0.25 W'],[0.5,'0.5 W'],[1,'1 W'],[2,'2 W'],[5,'5 W']]]],
  capacitor:[['C','Capacitance (µF)','num'],['Vmax','Voltage rating','sel',[[6.3,'6.3 V'],[10,'10 V'],[16,'16 V'],[25,'25 V'],[50,'50 V'],[100,'100 V']]],['polar','Polarized (electrolytic)','chk']],
  diode:[['Imax','Max current','sel',[[0.2,'200 mA (1N4148)'],[1,'1 A (1N4001)'],[3,'3 A (1N5401)']]]],
  led:[['color','Color','sel',[['red','Red (1.8 V)'],['yellow','Yellow (2.0 V)'],['green','Green (2.2 V)'],['blue','Blue (3.0 V)'],['white','White (3.1 V)']]],['Imax','Max current','sel',[[0.02,'20 mA'],[0.03,'30 mA'],[0.05,'50 mA']]]],
  bjt:[['pnp','Type','sel',[[false,'NPN'],[true,'PNP']]],['beta','Current gain (β)','num'],['Pmax','Power rating','sel',[[0.3,'0.3 W'],[0.625,'0.625 W (2N2222)'],[1.5,'1.5 W']]]],
  dc:[['V','Voltage (V)','num'],['r','Internal resistance (Ω)','num']],
  ac:[['V','Peak voltage (V)','num'],['f','Frequency (Hz)','num'],['r','Internal resistance (Ω)','num']],
  switch:[['closed','Closed','chk']],
};

let els=[], uid=0, selected=null, tool='select', running=true, speed=1, t=0;
let nodeIdx=new Map(), n=0, V=new Float64Array(0), A=null, z=null, junctions=[];
let particles=[], shakeT=0, logItems=[], dirty=true;

const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const key=p=>p.x+','+p.y;
const rotv=(dx,dy,r)=>{for(let i=0;i<r;i++)[dx,dy]=[-dy,dx];return [dx,dy]};
function terms(e){
  if(e.type==='bjt') return [[0,0],[2,-2],[2,2]].map(([dx,dy])=>{const [a,b]=rotv(dx,dy,e.rot);return {x:e.p.x+a,y:e.p.y+b}});
  return [e.a,e.b];
}
function nextName(type){
  const pre=TYPES[type].pre; if(!pre) return '';
  let m=0; for(const e of els){ if(e.name&&e.name.startsWith(pre)){const k=+e.name.slice(pre.length); if(k>m&&TYPES[e.type].pre===pre)m=k}}
  return pre+(m+1);
}
function mk(type,a,b,props,name){
  const e={id:++uid,type,props:Object.assign(TYPES[type].def(),props||{}),heat:0,failed:false,I:0,vc:0,vj:0,vbe:0,vbc:0,ph:[0,0,0],P:0,Vd:0,flame:0,shortLogged:false,hist:[]};
  if(type==='bjt'){e.p={x:a.x,y:a.y};e.rot=b||0}else{e.a={x:a.x,y:a.y};e.b={x:b.x,y:b.y}}
  e.name=name||nextName(type);
  return e;
}
function add(type,a,b,props){const e=mk(type,a,b,props);els.push(e);return e}

/* ---------- topology ---------- */
function splitWires(){
  for(let guard=0;guard<300;guard++){
    const pts=[]; for(const e of els) for(const p of terms(e)) pts.push(p);
    let did=false;
    for(const w of els){
      if(w.type!=='wire') continue;
      const dx=w.b.x-w.a.x, dy=w.b.y-w.a.y, L2=dx*dx+dy*dy; if(!L2) continue;
      for(const p of pts){
        const px=p.x-w.a.x, py=p.y-w.a.y;
        if(px*dy-py*dx!==0) continue;
        const d=px*dx+py*dy; if(d<=0||d>=L2) continue;
        const w2=mk('wire',{x:p.x,y:p.y},{x:w.b.x,y:w.b.y}); w.b={x:p.x,y:p.y}; els.push(w2); did=true; break;
      }
      if(did) break;
    }
    if(!did) return;
  }
}
function build(){
  els=els.filter(e=>e.type==='bjt'||e.a.x!==e.b.x||e.a.y!==e.b.y);
  splitWires();
  const count=new Map(); const keys=[];
  for(const e of els) for(const p of terms(e)){const k=key(p); if(!count.has(k)){count.set(k,0);keys.push(k)} count.set(k,count.get(k)+1)}
  const src=els.find(e=>e.type==='dc'||e.type==='ac');
  const gk=src?key(src.b):keys[0];
  nodeIdx=new Map(); n=0;
  for(const k of keys) nodeIdx.set(k,k===gk?-1:n++);
  for(const e of els) e.n=terms(e).map(p=>nodeIdx.get(key(p)));
  junctions=keys.filter(k=>count.get(k)>=3).map(k=>k.split(',').map(Number));
  V=new Float64Array(n); A=new Float64Array(n*n); z=new Float64Array(n);
  for(const e of els){e.vj=0;e.vbe=0;e.vbc=0}
  dirty=false; save();
}

/* ---------- device models ---------- */
function pnj(vnew,vold,vt,vcrit){
  if(vnew>vcrit&&Math.abs(vnew-vold)>2*vt){
    if(vold>0){const arg=1+(vnew-vold)/vt; vnew=arg>0?vold+vt*Math.log(arg):vcrit}
    else vnew=vt*Math.log(vnew/vt);
  }
  return vnew;
}
function dpar(e){
  let Is,nn,BV;
  if(e.type==='led'){const vf=LEDC[e.props.color].vf; nn=2; Is=0.01/Math.exp(vf/(nn*VT)); BV=5}
  else {Is=1e-14; nn=1; BV=100}
  const nvt=nn*VT, Isb=1e-10, vtb=VT;
  return {Is,nvt,BV,Isb,vtb,vcrit:nvt*Math.log(nvt/(Math.SQRT2*Is)),vcritb:vtb*Math.log(vtb/(Math.SQRT2*Isb))};
}
function dcalc(v,m){
  const ef=Math.exp(Math.min(v/m.nvt,80)), eb=Math.exp(Math.min(-(v+m.BV)/m.vtb,80));
  return [m.Is*(ef-1)-m.Isb*eb, m.Is/m.nvt*ef+m.Isb/m.vtb*eb+1e-12];
}
function dlimit(vraw,vold,m){
  if(vraw>=0) return pnj(vraw,vold,m.nvt,m.vcrit);
  const u=pnj(-(vraw+m.BV),-(vold+m.BV),m.vtb,m.vcritb); return -u-m.BV;
}
const QIS=1e-14, QVC=VT*Math.log(VT/(Math.SQRT2*QIS));
function qcalc(vbe,vbc,beta){
  const eF=Math.exp(Math.min(vbe/VT,80)), eR=Math.exp(Math.min(vbc/VT,80)), bR=1;
  const IF=QIS*(eF-1), IR=QIS*(eR-1), gF=QIS/VT*eF+1e-12, gR=QIS/VT*eR+1e-12;
  return {Ic:IF-IR-IR/bR, Ib:IF/beta+IR/bR, gF, gR, bR};
}
const srcV=e=>e.type==='dc'?e.props.V:e.props.V*Math.sin(2*Math.PI*e.props.f*t);

/* ---------- solver ---------- */
function vn(i){return i<0?0:V[i]}
function addA(r,c,v){if(r>=0&&c>=0)A[r*n+c]+=v}
function addZ(r,v){if(r>=0)z[r]+=v}
function sg(a,b,g){addA(a,a,g);addA(b,b,g);addA(a,b,-g);addA(b,a,-g)}
function si(a,b,i){addZ(a,-i);addZ(b,i)}
function stamp(e,dt){
  const [a,b]=e.n, p=e.props;
  switch(e.type){
    case 'wire': sg(a,b,1e3); return true;
    case 'switch': if(p.closed) sg(a,b,1e3); return true;
    case 'resistor': sg(a,b,1/Math.max(p.R,1e-3)); return true;
    case 'capacitor': {const g=p.C*1e-6/dt; sg(a,b,g); si(a,b,-g*e.vc); return true}
    case 'dc': case 'ac': {const g=1/Math.max(p.r,1e-3); sg(a,b,g); si(a,b,-g*srcV(e)); return true}
    case 'diode': case 'led': {
      const m=dpar(e), vraw=vn(a)-vn(b), v=dlimit(vraw,e.vj,m); e.vj=v;
      const [id,gd]=dcalc(v,m); sg(a,b,gd); si(a,b,id-gd*v);
      return Math.abs(v-vraw)<1e-9;
    }
    case 'bjt': {
      const [nb,nc,ne]=e.n, s=p.pnp?-1:1, Vb=vn(nb),Vc=vn(nc),Ve=vn(ne);
      const rbe=s*(Vb-Ve), rbc=s*(Vb-Vc);
      const vbe=pnj(rbe,e.vbe,VT,QVC), vbc=pnj(rbc,e.vbc,VT,QVC); e.vbe=vbe; e.vbc=vbc;
      const q=qcalc(vbe,vbc,Math.max(p.beta,1));
      const aB=q.gF/p.beta, bB=q.gR/q.bR, aC=q.gF, bC=-q.gR*(1+1/q.bR), aE=-(aB+aC), bE=-(bB+bC);
      const Ib0=q.Ib, Ic0=q.Ic, Ie0=-(Ib0+Ic0);
      for(const [nk,ak,bk,I0] of [[nb,aB,bB,Ib0],[nc,aC,bC,Ic0],[ne,aE,bE,Ie0]]){
        const c=I0-ak*vbe-bk*vbc;
        addA(nk,nb,ak+bk); addA(nk,ne,-ak); addA(nk,nc,-bk); addZ(nk,-s*c);
      }
      sg(nb,ne,1e-12); sg(nb,nc,1e-12);
      return Math.abs(vbe-rbe)<1e-9&&Math.abs(vbc-rbc)<1e-9;
    }
  }
  return true;
}
function solve(){
  for(let k=0;k<n;k++){
    let piv=k, mx=Math.abs(A[k*n+k]);
    for(let i=k+1;i<n;i++){const v=Math.abs(A[i*n+k]); if(v>mx){mx=v;piv=i}}
    if(piv!==k){for(let j=0;j<n;j++){const tmp=A[k*n+j];A[k*n+j]=A[piv*n+j];A[piv*n+j]=tmp} const tz=z[k];z[k]=z[piv];z[piv]=tz}
    let pv=A[k*n+k]; if(Math.abs(pv)<1e-30) pv=A[k*n+k]=1e-30;
    for(let i=k+1;i<n;i++){const f=A[i*n+k]/pv; if(f){for(let j=k;j<n;j++)A[i*n+j]-=f*A[k*n+j]; z[i]-=f*z[k]}}
  }
  const x=new Float64Array(n);
  for(let i=n-1;i>=0;i--){let s=z[i]; for(let j=i+1;j<n;j++)s-=A[i*n+j]*x[j]; x[i]=s/A[i*n+i]}
  return x;
}
function simStep(dt){
  if(n>0){
    for(let it=0;it<60;it++){
      A.fill(0); z.fill(0); let conv=true;
      for(let i=0;i<n;i++) A[i*n+i]=1e-9;
      for(const e of els) if(!e.failed&&!stamp(e,dt)) conv=false;
      const x=solve(); let md=0, bad=false;
      for(let i=0;i<n;i++){ if(!isFinite(x[i])){bad=true;break} md=Math.max(md,Math.abs(x[i]-V[i])) }
      if(bad){V.fill(0); for(const e of els){e.vj=0;e.vbe=0;e.vbc=0} break}
      V=x; if(conv&&md<1e-6) break;
    }
  }
  post(dt); t+=dt;
}

/* ---------- currents, stress and failures ---------- */
function post(dt){
  for(const e of els){
    const p=e.props;
    if(e.failed){e.I=0;e.P=0;e.Ib=e.Ic=e.Ie=0;continue}
    if(e.type==='bjt'){
      const [nb,nc,ne]=e.n, s=p.pnp?-1:1, Vb=vn(nb),Vc=vn(nc),Ve=vn(ne);
      const q=qcalc(s*(Vb-Ve),s*(Vb-Vc),Math.max(p.beta,1));
      e.Ib=s*q.Ib; e.Ic=s*q.Ic; e.Ie=-(e.Ib+e.Ic);
      e.P=e.Ib*Vb+e.Ic*Vc+e.Ie*Ve; e.Vce=Vc-Ve;

/* ---------- particles ---------- */

function fR(R){return R>=1e6?num(R/1e6)+' MΩ':R>=1e3?num(R/1e3)+' kΩ':num(R)+' Ω'}
function fA(I){const a=Math.abs(I);if(a>=1)return I.toFixed(2)+' A';if(a>=1e-3)return (I*1e3).toFixed(1)+' mA';if(a>=1e-6)return (I*1e6).toFixed(0)+' µA';return '0 mA'}
function fW(P){const a=Math.abs(P);return a>=1?P.toFixed(2)+' W':(P*1e3).toFixed(0)+' mW'}
const fV=v=>v.toFixed(2)+' V';

/* ---------- event log ---------- */
function log(msg,bad){logItems.unshift({t,msg,bad}); logItems=logItems.slice(0,40); const ol=$('log'); ol.innerHTML='';
  for(const it of logItems){const li=document.createElement('li'); if(it.bad)li.className='bad'; const tm=document.createElement('time'); tm.textContent=it.t.toFixed(2)+' s'; const sp=document.createElement('span'); sp.textContent=it.msg; li.append(tm,sp); ol.appendChild(li)}}

/* ---------- inspector ---------- */
function renderPanel(){
  const pn=$('panel'); pn.innerHTML='';
  if(!selected){
    pn.innerHTML=`<h2>Inspector</h2><div class="help"><p style="margin:0">Pick a part in the toolbar, then drag between two grid points to place it. Click a part to edit it.</p>
    <ul><li>Drag a part to move it. Drag a wire's end to stretch it.</li><li>Click a switch to flip it.</li><li>Parts that touch at a grid point are connected.</li></ul>
    <p style="margin:10px 0 0"><kbd>Del</kbd> delete · <kbd>F</kbd> flip polarity · <kbd>R</kbd> rotate transistor · <kbd>Space</kbd> pause · <kbd>Esc</kbd> select tool</p></div>`;
    return;
  }
  const e=selected, T=TYPES[e.type];
  const h=document.createElement('div'); h.innerHTML=`<h2></h2><div class="kind"></div>`; h.querySelector('h2').textContent=e.name||'Wire'; h.querySelector('.kind').textContent=T.label+(e.failed?' · failed':''); pn.appendChild(h);
  for(const [k,lab,kind,opts] of FIELDS[e.type]||[]){
    const f=document.createElement('div'); f.className='field'+(kind==='chk'?' chk':''); const id='f-'+k;
    let inp;
    if(kind==='num'){inp=document.createElement('input');inp.type='number';inp.step='any';inp.value=e.props[k]}
    else if(kind==='sel'){inp=document.createElement('select');opts.forEach(([v,l],i)=>{const o=document.createElement('option');o.value=i;o.textContent=l;if(v===e.props[k])o.selected=true;inp.appendChild(o)})}
    else {inp=document.createElement('input');inp.type='checkbox';inp.checked=!!e.props[k]}
    inp.id=id; const lb=document.createElement('label'); lb.htmlFor=id; lb.textContent=lab;
    const er=document.createElement('div'); er.className='err'; er.hidden=true;
    if(kind==='chk') f.append(inp,lb); else f.append(lb,inp,er);
    inp.addEventListener(kind==='num'?'input':'change',()=>{
      if(kind==='num'){const v=parseFloat(inp.value); if(!(v>0)&&!(k==='V'&&v===0)){er.textContent='Enter a number above 0';er.hidden=false;return} er.hidden=true; e.props[k]=v}
      else if(kind==='sel') e.props[k]=opts[+inp.value][0];
      else e.props[k]=inp.checked;
      save();
    });
    pn.appendChild(f);
  }
  const ro=document.createElement('div'); ro.className='readouts';
  ro.innerHTML=`<div class="ro"><span id="ro-l1">Voltage</span><b id="ro-1">–</b></div><div class="ro"><span id="ro-l2">Current</span><b id="ro-2">–</b></div><div class="ro"><span>Power</span><b id="ro-3">–</b></div><div class="ro"><span>Health</span><b id="ro-4">–</b></div>`;
  pn.appendChild(ro);
  const hb=document.createElement('div'); hb.className='health'; hb.innerHTML='<i id="ro-bar"></i>'; pn.appendChild(hb);
  const act=document.createElement('div'); act.className='actions';
  const btn=(t,fn,cls)=>{const b=document.createElement('button');b.textContent=t;if(cls)b.className=cls;b.onclick=fn;act.appendChild(b);return b};
  if(e.type!=='wire') btn(e.type==='bjt'?'Swap NPN / PNP':'Flip polarity',()=>flip(e));
  if(e.type==='bjt') btn('Rotate',()=>{e.rot=(e.rot+1)%4;dirty=true});
  if(e.type==='switch') btn(e.props.closed?'Open switch':'Close switch',()=>{toggleSwitch(e)});
  if(e.failed||e.heat>0) btn('Repair',()=>{e.failed=false;e.heat=0;e.vc=0;renderPanel()});
  btn('Delete',()=>remove(e),'danger');
  pn.appendChild(act);
  if(e.type!=='bjt'){
    const f=document.createElement('div'); f.className='field';
    f.innerHTML='<label for="f-replace">Replace with</label>';
    const s=document.createElement('select'); s.id='f-replace';
    s.innerHTML='<option value="">Choose a part…</option>'+TWO.filter(x=>x!==e.type).map(x=>`<option value="${x}">${TYPES[x].label}</option>`).join('');
    s.onchange=()=>{ if(!s.value)return; const ne=mk(s.value,e.a,e.b); els[els.indexOf(e)]=ne; log(`Replaced ${e.name||'wire'} with ${ne.name||'a wire'}.`); selected=ne; dirty=true; renderPanel() };
    f.appendChild(s); pn.appendChild(f);
  }
  updateReadouts();
}
function updateReadouts(){
  $('time').textContent='t = '+t.toFixed(2)+' s';
  const e=selected; if(!e||!$('ro-1')) return;
  if(e.type==='bjt'){$('ro-l1').textContent='Vce';$('ro-1').textContent=fV(e.Vce||0);$('ro-l2').textContent='Ic / Ib';$('ro-2').textContent=fA(e.Ic||0)+' / '+fA(e.Ib||0)}
  else{$('ro-l1').textContent=e.type==='capacitor'?'Charge voltage':'Voltage';$('ro-1').textContent=fV(e.type==='capacitor'?e.vc:(e.Vd||0));$('ro-l2').textContent='Current';$('ro-2').textContent=fA(e.I||0)}
  $('ro-3').textContent=fW(Math.abs(e.P||0));
  const hp=e.failed?0:Math.max(0,Math.round(100*(1-e.heat)));
  $('ro-4').textContent=e.failed?'Failed':hp+'%'; $('ro-4').style.color=hp<60?'var(--danger)':'';
  const bar=$('ro-bar'); bar.style.width=hp+'%'; bar.style.background=hp<60?'var(--danger)':'var(--ok)';
}

/* ---------- editing actions ---------- */
function flip(e){
  if(e.type==='bjt'){e.props.pnp=!e.props.pnp}
  else{[e.a,e.b]=[e.b,e.a]; e.vc=-e.vc}
  dirty=true; renderPanel(); log(`Flipped ${e.name}.`);
}
function toggleSwitch(e){e.props.closed=!e.props.closed;log(`${e.name} ${e.props.closed?'closed':'opened'}.`);if(selected===e)renderPanel();save()}
function remove(e){els=els.filter(x=>x!==e);if(selected===e)selected=null;dirty=true;renderPanel()}
function setTool(tl){tool=tl;for(const b of $('tools').querySelectorAll('button[data-tool]'))b.setAttribute('aria-pressed',b.dataset.tool===tl);updateHint()}
function updateHint(){
  const hints={select:'Click a part to edit it. Drag to move. Click a switch to flip it.',delete:'Click a part to delete it.',bjt:'Click a grid point to place the transistor (base on the left).',wire:'Drag between grid points to draw a wire.'};
  $('hint').textContent=hints[tool]||`Drag between two grid points to place a ${TYPES[tool].label.toLowerCase()}. The first point is the + side.`;
}

/* ---------- pointer input ---------- */
function ptr(ev){const r=cv.getBoundingClientRect();return {x:(ev.clientX-r.left)/r.width*LW,y:(ev.clientY-r.top)/r.height*LH}}
const snap=p=>({x:Math.max(1,Math.min(LW/G-1,Math.round(p.x/G))),y:Math.max(1,Math.min(LH/G-1,Math.round(p.y/G)))});
cv.addEventListener('pointerdown',ev=>{
  cv.setPointerCapture(ev.pointerId); const p=ptr(ev), g=snap(p);
  if(tool==='select'||tool==='delete'){
    const e=hit(p.x,p.y);
    if(tool==='delete'){if(e)remove(e);return}
    selected=e||null; renderPanel(); if(!e) return;
    let end=null;
    if(e.type!=='bjt'){ if(Math.hypot(p.x-e.a.x*G,p.y-e.a.y*G)<8)end='a'; else if(Math.hypot(p.x-e.b.x*G,p.y-e.b.y*G)<8)end='b' }
    drag={e,start:g,end,orig:e.type==='bjt'?{p:{...e.p}}:{a:{...e.a},b:{...e.b}},moved:false};
  } else if(tool==='bjt'){const e=add('bjt',g,0);selected=e;dirty=true;renderPanel()}
  else drawing={type:tool,a:g,b:g};
});
cv.addEventListener('pointermove',ev=>{
  const p=ptr(ev), g=snap(p); hover=g;
  if(drawing){drawing.b=g;return}
  if(drag){
    const dx=g.x-drag.start.x, dy=g.y-drag.start.y; if(!dx&&!dy&&!drag.moved)return; drag.moved=true;
    const e=drag.e, o=drag.orig;
    if(e.type==='bjt') e.p={x:o.p.x+dx,y:o.p.y+dy};
    else if(drag.end){e[drag.end]={x:o[drag.end].x+dx,y:o[drag.end].y+dy}}
    else {e.a={x:o.a.x+dx,y:o.a.y+dy};e.b={x:o.b.x+dx,y:o.b.y+dy}}
  }
});
cv.addEventListener('pointerleave',()=>{hover=null});
cv.addEventListener('pointerup',()=>{
  if(drawing){
    const d=drawing; drawing=null;
    if(gridLen(d.a,d.b)>=TYPES[d.type].min){const e=add(d.type,d.a,d.b);selected=e;dirty=true;renderPanel()}
    else if(gridLen(d.a,d.b)>0) $('hint').textContent='Parts need at least two grid squares. Drag a little further.';
  }
  if(drag){
    if(!drag.moved&&drag.e.type==='switch') toggleSwitch(drag.e);
    if(drag.moved) dirty=true;
    drag=null;
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.target.closest&&ev.target.closest('input,select,textarea')) return;
  if((ev.key==='Delete'||ev.key==='Backspace')&&selected){ev.preventDefault();remove(selected)}
  else if((ev.key==='f'||ev.key==='F')&&selected&&selected.type!=='wire') flip(selected);
  else if((ev.key==='r'||ev.key==='R')&&selected&&selected.type==='bjt'){selected.rot=(selected.rot+1)%4;dirty=true}
  else if(ev.key===' '){ev.preventDefault();togglePlay()}
  else if(ev.key==='Escape'){setTool('select');drawing=null}
});

/* ---------- toolbar and header ---------- */
const TOOLS=[['select','Select'],['delete','Delete'],null,['wire','Wire'],['resistor','Resistor'],['capacitor','Capacitor'],['diode','Diode'],['led','LED'],['bjt','Transistor'],['switch','Switch'],null,['dc','DC source'],['ac','AC source']];
for(const tl of TOOLS){
  if(!tl){const s=document.createElement('span');s.className='sep';$('tools').appendChild(s);continue}
  const b=document.createElement('button'); b.dataset.tool=tl[0]; b.textContent=tl[1]; b.onclick=()=>setTool(tl[0]); $('tools').appendChild(b);
}
function togglePlay(){running=!running;$('play').textContent=running?'Pause':'Run';$('play').className=running?'primary':''}
$('play').onclick=togglePlay;
$('speed').onchange=e=>{speed=+e.target.value};
$('repair').onclick=()=>{for(const e of els){e.failed=false;e.heat=0;e.vc=0;e.flame=0;e.hist=[]} t=0; particles=[]; dirty=true; log('All parts repaired and capacitors discharged.'); renderPanel()};
$('clear').onclick=()=>{els=[];selected=null;particles=[];t=0;dirty=true;log('Cleared the bench.');renderPanel()};

/* ---------- examples ---------- */
const P=(x,y)=>({x,y});
const EXAMPLES={
  series:{name:'LED and capacitor in series',build(){
    add('dc',P(4,6),P(4,18)); add('switch',P(4,6),P(10,6),{closed:false}); add('capacitor',P(10,6),P(16,6),{C:2200,Vmax:16});
    add('resistor',P(16,6),P(24,6)); add('wire',P(24,6),P(32,6)); add('led',P(32,6),P(32,18)); add('wire',P(32,18),P(4,18));}},
  parallel:{name:'Capacitor keeps an LED lit',build(){
    add('dc',P(4,6),P(4,18)); add('switch',P(4,6),P(12,6),{closed:false}); add('wire',P(12,6),P(24,6));
    add('capacitor',P(12,6),P(12,18),{C:2200,Vmax:16}); add('resistor',P(24,6),P(24,12)); add('led',P(24,12),P(24,18)); add('wire',P(24,18),P(4,18));}},
  nores:{name:'LED with no resistor',build(){
    add('dc',P(4,6),P(4,18)); add('switch',P(4,6),P(12,6),{closed:false}); add('wire',P(12,6),P(22,6)); add('led',P(22,6),P(22,18)); add('wire',P(22,18),P(4,18));}},
  revcap:{name:'Capacitor wired backwards',build(){
    add('dc',P(4,6),P(4,18)); add('switch',P(4,6),P(10,6),{closed:false}); add('capacitor',P(16,6),P(10,6),{C:100,Vmax:16});
    add('resistor',P(16,6),P(24,6),{R:100}); add('wire',P(24,6),P(24,18)); add('wire',P(24,18),P(4,18));}},
  bjt:{name:'Transistor switch',build(){
    add('dc',P(4,4),P(4,22)); add('wire',P(4,4),P(24,4)); add('switch',P(12,4),P(12,14),{closed:false}); add('resistor',P(12,14),P(22,14),{R:10000});
    add('bjt',P(22,14),0); add('resistor',P(24,4),P(24,8)); add('led',P(24,8),P(24,12),{color:'green'}); add('wire',P(24,16),P(24,22)); add('wire',P(24,22),P(4,22));}},
  ac:{name:'AC rectifier',build(){
    add('ac',P(4,6),P(4,18),{V:10,f:1}); add('diode',P(4,6),P(12,6)); add('capacitor',P(12,6),P(12,18),{C:470,Vmax:25}); add('wire',P(12,6),P(22,6));
    add('resistor',P(22,6),P(22,12),{R:1000}); add('led',P(22,12),P(22,18),{color:'blue'}); add('wire',P(22,18),P(4,18));}},
};
for(const [k,v] of Object.entries(EXAMPLES)){const o=document.createElement('option');o.value=k;o.textContent=v.name;$('examples').appendChild(o)}
function loadExample(k){els=[];selected=null;particles=[];t=0;EXAMPLES[k].build();dirty=true;renderPanel();log(`Loaded example: ${EXAMPLES[k].name}.`)}
$('examples').onchange=e=>{if(e.target.value)loadExample(e.target.value);e.target.value=''};

/* ---------- save / restore (this browser only) ---------- */
function save(){try{localStorage.setItem(SAVE,JSON.stringify(els.map(e=>({type:e.type,a:e.a,b:e.b,p:e.p,rot:e.rot,props:e.props,name:e.name}))))}catch(_){}}
function restore(){
  try{const raw=localStorage.getItem(SAVE); if(!raw)return false; const arr=JSON.parse(raw); if(!Array.isArray(arr)||!arr.length)return false;
    els=arr.filter(d=>TYPES[d.type]).map(d=>mk(d.type,d.type==='bjt'?d.p:d.a,d.type==='bjt'?d.rot:d.b,d.props,d.name)); return els.length>0}catch(_){return false}
}

/* ---------- graphs ---------- */
const WIN=6, HCOL=['#3b82c4','#d0592b','#2e9e6a','#9a5cc6','#c9a227','#d04f8a','#3fa6b8','#7d8a2e'];
const partV=e=>e.type==='bjt'?(e.Vce||0):e.type==='capacitor'?e.vc:(e.Vd||0);
const partI=e=>e.type==='bjt'?(e.Ic||0):(e.I||0);
function record(){
  for(const e of els){
    if(e.type==='wire') continue;
    e.hist.push([t,partV(e),partI(e),e.failed?0:Math.max(0,100*(1-e.heat))]);
    let k=0; while(k<e.hist.length&&e.hist[k][0]<t-WIN-0.5)k++; if(k)e.hist.splice(0,k);
  }
}
function niceStep(x){const p=10**Math.floor(Math.log10(x));for(const m of [1,2,2.5,5,10])if(m*p>=x-1e-15)return m*p;return 10*p}
function niceRange(lo,hi,minSpan){
  lo=Math.min(lo,0); hi=Math.max(hi,0); if(hi-lo<minSpan){hi=Math.max(hi,lo+minSpan)}
  let step=niceStep((hi-lo)/4), min=0;
  for(let i=0;i<8;i++){min=Math.floor(lo/step+1e-9)*step; if(min+4*step>=hi-1e-12)break; step=niceStep(step*1.01)}
  return {min,max:min+4*step};
}
const fVx=v=>num(Math.abs(v)<1e-9?0:v)+' V';
function fAx(v){const a=Math.abs(v);if(a<1e-12)return '0 mA';return a>=1?num(v)+' A':a>=1e-3?num(v*1e3)+' mA':num(v*1e6)+' µA'}
function drawChart(c,o){
  const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight; if(!w)return;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const pl=58,pr=o.yR?62:24,pt=8,pb=22,W=w-pl-pr,H=h-pt-pb, X=tt=>pl+(tt-o.t0)/(o.t1-o.t0)*W;
  const L=o.yL, YL=v=>pt+H-(v-L.min)/(L.max-L.min)*H;
  g.font='11px "JetBrains Mono", ui-monospace, monospace'; g.lineWidth=1;
  for(let k=0;k<=4;k++){
    const v=L.min+(L.max-L.min)*k/4, y=Math.round(YL(v))+0.5;
    g.strokeStyle=tok.line; g.beginPath(); g.moveTo(pl,y); g.lineTo(pl+W,y); g.stroke();
    g.fillStyle=o.yR?tok.volt:tok.muted; g.textAlign='right'; g.fillText(L.fmt(v),pl-6,y+4);
    if(o.yR){const R=o.yR; g.fillStyle=tok.amp; g.textAlign='left'; g.fillText(R.fmt(R.min+(R.max-R.min)*k/4),pl+W+6,y+4)}
  }
  if(L.min<0&&L.max>0){g.strokeStyle=tok.muted;g.beginPath();g.moveTo(pl,YL(0));g.lineTo(pl+W,YL(0));g.stroke()}
  g.fillStyle=tok.muted; g.textAlign='center';
  for(let k=0;k<=6;k++){const tt=o.t0+(o.t1-o.t0)*k/6; g.fillText(tt.toFixed(1)+' s',X(tt),h-6)}
  if(o.empty){g.font='13px Inter, system-ui, sans-serif';g.fillText(o.empty,pl+W/2,pt+H/2);return}
  g.save(); g.beginPath(); g.rect(pl,pt-2,W,H+4); g.clip(); g.lineJoin='round';
  for(const s of o.series){
    const ax=s.axis==='R'?o.yR:L, Y=v=>pt+H-(v-ax.min)/(ax.max-ax.min)*H;
    g.strokeStyle=s.color; g.lineWidth=s.width||1.8; g.globalAlpha=s.alpha||1; g.beginPath(); let first=true;
    for(const p of s.pts){ if(p[0]<o.t0-0.2)continue; const x=X(p[0]),y=Y(p[s.k]); if(first){g.moveTo(x,y);first=false}else g.lineTo(x,y) }
    g.stroke();
  }
  g.restore();
}
let legendKey='';
function drawGraphs(){
  const t1=Math.max(t,WIN), t0=t1-WIN, inWin=p=>p[0]>=t0-0.2;
  const e=selected&&selected.type!=='wire'?selected:null;
  if(e){
    $('gv-title').textContent=`${e.name} voltage and current`+(e.type==='bjt'?' (Vce, Ic)':'');
    let vlo=0,vhi=0,ilo=0,ihi=0; for(const p of e.hist) if(inWin(p)){vlo=Math.min(vlo,p[1]);vhi=Math.max(vhi,p[1]);ilo=Math.min(ilo,p[2]);ihi=Math.max(ihi,p[2])}
    const yL=niceRange(vlo,vhi,1), yR=niceRange(ilo,ihi,1e-3);
    drawChart($('gv'),{t0,t1,yL:{...yL,fmt:fVx},yR:{...yR,fmt:fAx},series:[{pts:e.hist,k:2,color:tok.amp,axis:'R'},{pts:e.hist,k:1,color:tok.volt}]});
  } else {
    $('gv-title').textContent='Voltage and current';
    drawChart($('gv'),{t0,t1,yL:{min:0,max:10,fmt:fVx},empty:'Select a part to plot its voltage and current'});
  }
  const parts=els.filter(x=>['resistor','capacitor','diode','led','bjt'].includes(x.type));
  const lk=parts.map(x=>x.id+':'+x.name).join('|')+'#'+(selected?selected.id:'');
  if(lk!==legendKey){legendKey=lk; const lg=$('gh-legend'); lg.innerHTML='';
    parts.forEach((x,i)=>{const s=document.createElement('span'); const sw=document.createElement('i'); sw.style.background=HCOL[i%HCOL.length]; s.append(sw,x.name); if(x===selected)s.style.color='var(--ink)'; lg.appendChild(s)})}
  drawChart($('gh'),{t0,t1,yL:{min:0,max:100,fmt:v=>Math.round(v)+'%'},empty:parts.length?null:'Add a resistor, capacitor, diode, LED or transistor to track its health',
    series:parts.map((x,i)=>({pts:x.hist,k:3,color:HCOL[i%HCOL.length],width:x===selected?3:1.8,alpha:selected&&x!==selected?0.55:1}))});
}

/* ---------- main loop ---------- */
let last=null, lastUi=0, lastTok=0;
function frame(ts){
  const dtr=last?Math.min(0.05,(ts-last)/1000):0; last=ts;
  if(ts-lastTok>1000){readTokens();lastTok=ts}
  if(dirty) build();
  if(running&&dtr>0){
    const steps=n<20?60:n<50?24:8, sd=dtr*speed/steps;
    for(let k=0;k<steps;k++) simStep(sd);
    record();
  }
  stepParticles(dtr); draw(dtr); drawGraphs();
  if(ts-lastUi>120){updateReadouts();lastUi=ts}
  requestAnimationFrame(frame);
}
readTokens(); setTool('select');
if(restore()){renderPanel();log('Restored your last circuit.')} else loadExample('series');
requestAnimationFrame(frame);
})();
</script>

</html>
